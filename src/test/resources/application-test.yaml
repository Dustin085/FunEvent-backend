# 測試專用覆寫。搭配 @ActiveProfiles("test") 使用，
# 會疊在 application.yaml 之上（不是取代），只覆蓋這裡有寫的項目。
# 注意：若命名成 application.yaml 會整個蓋掉主設定，app.* 那些屬性會全部消失。
spring:
  datasource:
    # 跟開發用的 funevent 分開，避免測試資料污染 h2-console 看到的那個庫
    url: jdbc:h2:mem:funevent-test;DB_CLOSE_DELAY=-1
  # ⚠️ 暫時關掉。測試目前還在 H2 上跑，而 V1__init.sql 是 PostgreSQL 語法
  # （generated by default as identity、uuid 型別），拿去打 H2 會直接炸。
  # 導入 Testcontainers 之後這段要刪掉 —— 屆時測試的 schema 也改由 Flyway 建，
  # 這樣 migration 檔本身每跑一次測試就被驗證一次。
  flyway:
    enabled: false

  jpa:
    hibernate:
      # 測試結束就把 schema 丟掉
      ddl-auto: create-drop
    show-sql: false
  mail:
    # 測試不會真的寄信，填假的只是為了讓容器啟動得起來
    # （主設定的 ${MAIL_USERNAME} 沒有預設值，解不開會導致啟動失敗）
    username: test@example.com
    password: test
  # 測試不需要 console。順帶讓測試持續守住一件事：
  # console 關掉時，SecurityConfig 的 h2ConsoleSecurityFilterChain 必須跟著消失，
  # 否則每個請求都會因為找不到 H2ConsoleProperties 而 500。
  h2:
    console:
      enabled: false

# 測試自己準備固定資料，示範資料會干擾 SQL 句數斷言與各測試的筆數斷言
app:
  demo-data:
    enabled: false
  order:
    expiry:
      # ⚠️ 測試自己控制何時觸發取消，不要讓排程在背景亂動資料 ——
      # 否則斷言會在毫無規律的時機失敗，而且非常難重現
      enabled: false
  # 測試不會真的打 Google，填假的只是為了讓容器啟動得起來
  #（主設定的 ${GOOGLE_CLIENT_ID} 沒有預設值，@ConfigurationProperties 在啟動時
  #  就會解析它，解不開會導致所有 @SpringBootTest 啟動失敗）
  oauth:
    google:
      client-id: test-client-id
      client-secret: test-client-secret
      allowed-audiences:
        - test-client-id

logging:
  level:
    org.hibernate.orm.jdbc.bind: warn
