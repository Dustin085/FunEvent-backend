# 測試專用覆寫。搭配 @ActiveProfiles("test") 使用，
# 會疊在 application.yaml 之上（不是取代），只覆蓋這裡有寫的項目。
# 注意：若命名成 application.yaml 會整個蓋掉主設定，app.* 那些屬性會全部消失。
spring:
  datasource:
    # ⭐ jdbc:tc: 是 Testcontainers 的 URL scheme：第一次連線時由 JDBC 驅動
    # 自己把 PostgreSQL 容器拉起來，測試結束再收掉。整個 JVM 內同一個 URL
    # 共用一個容器，所以 25 個測試類別只會起一次。
    #
    # ⭐ 選它而不是 @ServiceConnection，是因為這個專案的 25 個測試類別
    # 沒有共用基底類別 —— 走 @ServiceConnection 要在每個檔案加 @Import，
    # 而這樣改設定就好，測試檔案一個都不用動。
    #
    # ⚠️ 版本要釘死（postgresql:17）。跟著 latest 走的話，測試會在
    # 某天某次 docker pull 之後莫名其妙地換一個資料庫版本。
    # ⚠️ 這裡也是 DatabaseCleaner 的防呆所檢查的值，改它之前先看那個檔案。
    url: jdbc:tc:postgresql:17:///funevent
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      # ⭐ 不覆寫，沿用主設定的 validate ——
      # schema 由 Flyway 的 V1__init.sql 建，Hibernate 只負責檢查對不對得上。
      # 意思是 migration 檔本身每跑一次測試就被驗證一次：
      # 只要有人改了 entity 卻忘記寫 migration，測試會全部啟動失敗。
      # ⚠️ 別改回 create-drop —— 那會讓 Hibernate 照 entity 建表，
      # 於是 migration 漏寫也照樣綠燈，正好把這道防線關掉。
      ddl-auto: validate
    show-sql: false
  mail:
    # 測試不會真的寄信，填假的只是為了讓容器啟動得起來
    # （主設定的 ${MAIL_USERNAME} 沒有預設值，解不開會導致啟動失敗）
    username: test@example.com
    password: test
# 測試自己準備固定資料，示範資料會干擾 SQL 句數斷言與各測試的筆數斷言
app:
  demo-data:
    enabled: false
  order:
    expiry:
      # ⚠️ 測試自己控制何時觸發取消，不要讓排程在背景亂動資料 ——
      # 否則斷言會在毫無規律的時機失敗，而且非常難重現
      enabled: false
  # 測試不會真的打 Google，填假的只是為了讓容器啟動得起來
  #（主設定的 ${GOOGLE_CLIENT_ID} 沒有預設值，@ConfigurationProperties 在啟動時
  #  就會解析它，解不開會導致所有 @SpringBootTest 啟動失敗）
  oauth:
    google:
      client-id: test-client-id
      client-secret: test-client-secret
      allowed-audiences:
        - test-client-id

logging:
  level:
    org.hibernate.orm.jdbc.bind: warn
