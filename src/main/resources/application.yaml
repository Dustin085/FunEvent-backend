# Render（以及大多數 PaaS）會注入 PORT 環境變數，並且只把流量轉給那個 port ——
# 服務開機成功但沒有監聽 PORT 的話，健康檢查會一直失敗，Render 判定部署失敗。
# 本機開發沒有 PORT 這個環境變數，所以退回 8080，跟 docker-compose 的習慣一致。
server:
  port: ${PORT:8080}

spring:
  application:
    name: FunEvent-backend

  # ── 資料庫連線 ──────────────────────────────────────────────
  # 本機開發連 docker-compose.yml 起的 PostgreSQL：docker compose up -d
  # 預設值跟 docker-compose.yml 的 POSTGRES_* 成對，正式環境用環境變數整組覆蓋。
  #
  # ⚠️ 資料現在會持久化。DemoDataSeeder 的 count() > 0 防線代表「重啟不會重跑」，
  #    想要一份乾淨的示範資料要 docker compose down -v。
  #
  # 沒有 driver-class-name：Boot 從 URL 的 jdbc:postgresql: 前綴就推得出來，
  # 寫了只是多一個之後換 DB 會忘記改的地方。
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/funevent}
    username: ${DB_USERNAME:funevent}
    password: ${DB_PASSWORD:funevent}

  # ── JPA / Hibernate ────────────────────────────────────────
  jpa:
    hibernate:
      # schema 由 Flyway 管（src/main/resources/db/migration）。
      # validate 只做一件事：啟動時比對 entity 與實際 schema，對不上就拒絕啟動。
      #
      # ⚠️ 它檢查表、欄位、型別，但**不檢查約束名、索引、CHECK 條件**——
      # 那些漏掉的話 validate 會照樣放行，要靠測試守。
      # ⚠️ 加欄位不再自動生效了，要寫一個新的 V2__xxx.sql。
      ddl-auto: validate
    # 把 Hibernate 產生的 SQL 印出來，方便對照 Entity 與實際 SQL
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
    # 關閉 Open Session In View。
    # 預設 true 會讓 DB session 一路撐到 View 渲染完，容易寫出隱藏的 N+1 查詢。
    # 關掉後 lazy 關聯若在 Service 外才存取會直接報錯 —— 這是好事，能逼出真正的問題。
    # 關掉後 Session 只會保持在一次 Transactional 之中
    open-in-view: false

  # mail setting
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  access-token:
    secret: ${JWT_SECRET:dev-only-secret-dsafjdfjieawjfeaidjofasiegnoawjio}
    expiration: 900000 # 15 分鐘
  ticket:
    # 票券 QR 的簽章金鑰。
    # ⚠️ 絕對不能跟 access-token.secret 共用 —— 不同用途的簽章共用金鑰時，
    # 其中一邊的漏洞會擴散到另一邊。
    # ⚠️ 換掉這個值會讓所有已經發出去的 QR 立刻失效。
    secret: ${TICKET_SECRET:dev-only-ticket-secret-do-not-use-in-production}
  refresh-token:
    expiration: 604800000 # 7 天
    # 寬限期（reuse interval）：已使用的 RT 在這段時間內再次出現，
    # 視為併發重送而非竊用。⚠️ 這段時間內真的被竊用會放行，所以要短。
    # Boot 會把 30s 解析成 java.time.Duration（同 app.order.payment-timeout）
    reuse-interval: 30s
  order:
    # 建單後多久未付款就自動取消並回補庫存。
    # Boot 會把 15m 這種寫法解析成 java.time.Duration
    payment-timeout: 15m
    expiry:
      enabled: true
      scan-interval: 60s
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      # ⚠️ 清單而非單一值：之後 App 版的 client_id 不一樣
      allowed-audiences:
        - ${GOOGLE_CLIENT_ID}

  # ── CORS ───────────────────────────────────────────────────
  # 允許哪些前端來源讀取本 API 的回應。
  # 部署時用環境變數覆蓋成正式網域，例如 https://funevent.com
  # 多個來源用逗號分隔，Spring 會自動切成 List
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

  # 前端 URL
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

  # 開發用示範資料。⚠️ 預設關閉 —— 它會建立密碼公開的帳號。
  # 本機開發請在 run configuration 設環境變數 DEMO_DATA=true
  demo-data:
    enabled: ${DEMO_DATA:false}

  # ── 金流 ───────────────────────────────────────────────────
  payment:
    # 預設 fake：測試與本機開發不需要真的金鑰。
    # ⚠️ 假閘道不驗簽，正式環境務必改成 ecpay。要使用 ecpay，需要公開網址，可用 ngrok (ngrok http 8080)
    gateway: ${PAYMENT_GATEWAY:fake}
    ecpay:
      # 這三個是綠界公開的測試環境值，正式金鑰一定要走環境變數
      merchant-id: ${ECPAY_MERCHANT_ID:3002607}
      hash-key: ${ECPAY_HASH_KEY:pwFHCqoQZGmho4w6}
      hash-iv: ${ECPAY_HASH_IV:EkRm7iFT261dpevs}
      # 測試環境是 payment-stage，正式環境是 payment
      api-url: ${ECPAY_API_URL:https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/V5}
      # 綠界伺服器打回來的網址，必須是公開可連的（本機開發要用 ngrok 之類的通道）
      return-url: ${ECPAY_RETURN_URL:}
      # 綠界付款頁上「返回商店」按鈕要導去的位置。
      # 預設沿用 app.frontend-url —— Spring 支援巢狀 placeholder
      client-back-url: ${ECPAY_CLIENT_BACK_URL:${app.frontend-url}}

# ── Log 等級 ──────────────────────────────────────────────────
logging:
  level:
    # ⚠️ 曾經是 trace（顯示 SQL 中 ? 實際綁定的參數值，除錯時很有用），
    # 但 trace 會把 refresh token hash、密碼 hash、重設密碼 token hash
    # 全部印進去。正式環境的 log 通常是能被多人查看的（Render 的 log 面板、
    # 之後接的任何 log 服務），這些是不該被任何人看到的東西 —— 即使是展示用的
    # 假資料環境。要重新對照 SQL 綁定值時，本機開發手動改回 trace 即可，
    # 不要讓它變成常態設定
    org.hibernate.orm.jdbc.bind: warn
